name: Release

# Builds the installers for every platform. Nothing is published unless asked for:
#
#   push to master / main  builds and signs everything and keeps it as workflow artifacts (checks that releases work)
#   push of a tag v<ver>    builds, signs and PUBLISHES the release (the tag must equal the version in Cargo.toml)
#   run by hand + publish   the same, from the branch picked in "Run workflow"
#
# A release serves two updaters, which is what lets installed Tauri builds of OpsBatch move to this version:
#   * the Tauri updater of the original app reads latest.json from releases/latest/download and installs
#     OpsBatch-<ver>-macos-<arch>.app.tar.gz / -windows-x86_64-setup.exe / -linux-x86_64.AppImage after checking their .sig
#   * the in-app updater of this build (crates/ops-core/src/update.rs) downloads OpsBatch-<ver>-<os>-<arch>.<dmg|setup.exe|AppImage>,
#     SHA256SUMS and the .sig of the installer
# Both verify the same minisign key, so the Tauri updater key secrets are reused (same names as the original repo):
#   TAURI_UPDATER_PUBKEY, TAURI_UPDATER_PRIVATE_KEY, TAURI_UPDATER_PRIVATE_KEY_PASSWORD
# The public key is compiled into the app as OPSBATCH_UPDATER_PUBKEY.
#
# To release: raise `version` in Cargo.toml (the Tauri updater only offers a version higher than the installed one),
# merge, and push the tag v<version>. The release notes fill in by themselves: release-notes/v<version>.md if you
# wrote one, otherwise the commits since the previous release tag, grouped (scripts/release-notes.sh).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish v<version from Cargo.toml> as the latest release (needs the updater secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}

env:
  # Production builds keep the encrypted vault in the system keystore and the Tauri build's data directory.
  OPSBATCH_FEATURES: real-vault

jobs:
  # The updater key is only given to the jobs that compile it in or sign with it; `test` runs without it.
  plan:
    runs-on: ubuntu-latest
    env:
      OPSBATCH_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: |
          set -eu
          PUBLISH=${PUBLISH:-false}
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml (expected $tag)"
              exit 1
            fi
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$OPSBATCH_UPDATER_PUBKEY" ]; then
              echo "::error::publishing needs the TAURI_UPDATER_PUBKEY and TAURI_UPDATER_PRIVATE_KEY secrets: installed apps refuse unsigned updates"
              exit 1
            fi
          fi
          echo "building $tag, publish=$PUBLISH"

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps (gpui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig1-dev libssl-dev libgtk-3-dev libxdo-dev
      - run: cargo test --workspace

  macos:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      OPSBATCH_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
      # secrets are not available to step-level `if`, so mirror the optional one into the job environment
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build app and dmg
        env:
          OPSBATCH_TARGET: ${{ matrix.target }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/build.sh
      # The Tauri updater swaps the installed .app for the one inside this archive.
      - name: Updater archive
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: COPYFILE_DISABLE=1 tar -C dist -czf "dist/OpsBatch-$VERSION-macos-${{ matrix.arch }}.app.tar.gz" OpsBatch.app
      - name: Sign updates
        run: scripts/sign-updates.sh dist/*.dmg dist/*.app.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.sig
          if-no-files-found: error

  windows:
    needs: [plan, test]
    runs-on: windows-latest
    env:
      OPSBATCH_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare signing certificate
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          "WINDOWS_CODESIGN_CERT_PATH=$env:RUNNER_TEMP\codesign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        env:
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
        shell: pwsh
        run: packaging/windows/build.ps1
      - name: Sign updates
        shell: bash
        run: scripts/sign-updates.sh dist/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*-setup.exe
            dist/*.sig
          if-no-files-found: error

  linux:
    needs: [plan, test]
    runs-on: ubuntu-22.04
    env:
      OPSBATCH_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig1-dev libssl-dev libgtk-3-dev libxdo-dev libfuse2 \
            libdbus-1-dev pkg-config
      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage and deb
        run: packaging/linux/build.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Sign updates
        run: scripts/sign-updates.sh dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.sig
          if-no-files-found: error

  publish:
    needs: [plan, macos, windows, linux]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous release tag
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # release-notes/<tag>.md when it exists, otherwise the commits since the previous release, grouped. The same
      # text is the release body and the notes the update dialog of an installed app shows (latest.json).
      - name: Release notes
        run: scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" | tee "$RUNNER_TEMP/notes.md"
      - name: Checksums and manifest
        run: |
          set -eu
          scripts/checksums.sh dist
          NOTES="$(cat "$RUNNER_TEMP/notes.md")" scripts/latest-json.sh dist "$TAG" "$GITHUB_REPOSITORY"
      # A release is created as a draft and published last, so releases/latest (and latest.json) never points at a
      # release that is still missing assets. A published release that already has latest.json is never overwritten:
      # raise the version instead.
      - name: Publish release
        run: |
          set -eu
          if gh release view "$TAG" --json isDraft,assets > release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft release.json)" = false ] && jq -e '.assets[] | select(.name == "latest.json")' release.json > /dev/null; then
              echo "::error::release $TAG is already published; raise the version in Cargo.toml and tag again"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" --title "OpsBatch $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release edit "$TAG" --draft=false --latest

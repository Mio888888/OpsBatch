[package]
name = "spike-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["syntect"]
# Lightweight regex highlighter (~200 languages via bat's syntax set).
syntect = ["gpui-kit/syntect"]
# Structural highlighter; pick grammars individually.
tree-sitter = [
    "gpui-kit/tree-sitter",
    "gpui-kit/tree-sitter-bash", "gpui-kit/tree-sitter-python", "gpui-kit/tree-sitter-yaml",
    "gpui-kit/tree-sitter-rust", "gpui-kit/tree-sitter-javascript", "gpui-kit/tree-sitter-html",
    "gpui-kit/tree-sitter-css", "gpui-kit/tree-sitter-sql", "gpui-kit/tree-sitter-markdown",
    "gpui-kit/tree-sitter-c", "gpui-kit/tree-sitter-cpp", "gpui-kit/tree-sitter-java",
    "gpui-kit/tree-sitter-toml", "gpui-kit/tree-sitter-go",
]

[dependencies]
gpui-kit = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

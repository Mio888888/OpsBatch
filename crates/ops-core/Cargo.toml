[package]
name = "ops-core"
description = "OpsBatch core: models, database, vault, settings, event bus, runtime bridge (TASKS M1-01..13)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Real encrypted vault + OS keychain (enabled last, TASKS M1-05). Off = in-memory secrets, no keychain prompts.
real-vault = ["dep:keyring", "dep:aes-gcm", "dep:base64", "dep:security-framework"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
flume.workspace = true
parking_lot.workspace = true
log.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24"
dashmap = "6"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
arboard = { version = "3.6", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.23", optional = true }
minisign-verify = "0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
minisign = "0.10.0"

name: Vault keystores

# Runs the encrypted vault against each system's REAL keystore (macOS Keychain, Windows Credential Manager, Linux Secret
# Service) and against a Linux machine without any keystore. Every run uses a throw-away service name and data directory.
# Run it by hand (Actions > Vault keystores > Run workflow) or by touching the vault code.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/ops-core/src/keychain*.rs"
      - "crates/ops-core/examples/vault_check.rs"
      - "scripts/verify-real-vault.sh"
      - ".github/workflows/vault-keystores.yml"

jobs:
  keystore:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps (D-Bus, gnome-keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring libssl-dev
      - name: Real keystore round trip (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: scripts/verify-real-vault.sh
      - name: Real keystore round trip (Linux, gnome-keyring in a private D-Bus session)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            scripts/verify-real-vault.sh
          '

  no-keystore:
    name: no keystore (Linux without a Secret Service)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev
      - name: Startup password only
        run: |
          unset DBUS_SESSION_BUS_ADDRESS
          scripts/verify-real-vault.sh --no-keychain

name: Feature request / 功能请求
description: Suggest an idea or an improvement / 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / 想解决的问题
      description: What are you trying to do that is hard or impossible today? / 现在哪件事做起来困难或做不到？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: Area / 所属模块
      options:
        - Terminal / SSH
        - SFTP / editor
        - Batch execution / broadcast
        - RDP
        - VNC
        - Libraries / repository sync
        - Workflow
        - AI / MCP
        - Vault / keychain / data
        - Update / installer
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / 参与意愿
      options:
        - label: I would like to send a pull request for this / 我愿意为此提交 Pull Request
